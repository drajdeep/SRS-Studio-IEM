<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRS Studio — ISO/IEC/IEEE 29148 SRS Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFBFC; --panel:#FFFFFF; --ink:#17222D; --muted:#5B6B7A;
  --line:#D9E0E7; --line-soft:#EAEFF3;
  --accent:#0F4C81; --accent-soft:#E7F0F8; --accent-ink:#0B3A63;
  --ok:#1E7F4F; --warn:#C77D0A; --draft:#8A5CC7; --danger:#B3372E;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;overflow:hidden;display:flex;flex-direction:column}
button{font-family:var(--sans);cursor:pointer}
textarea,input,select{font-family:var(--sans);font-size:13px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── Institute banner ─────────────── */
#banner{background:#fff;border-bottom:1px solid var(--line);text-align:center;padding:6px 10px}
#banner img{max-width:600px;width:100%;height:auto;display:inline-block}

/* ── Toolbar ─────────────────────────── */
#toolbar{display:flex;align-items:center;gap:8px;height:52px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:nowrap}
#brand{display:flex;align-items:baseline;gap:8px;margin-right:10px;white-space:nowrap}
#brand b{font-weight:700;font-size:15px;letter-spacing:.2px}
#brand span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.tb-group{display:flex;gap:6px;align-items:center;border-left:1px solid var(--line-soft);padding-left:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.sm{padding:4px 8px;font-size:11.5px}
#doctitle{border:1px solid transparent;border-radius:6px;padding:6px 8px;font-weight:600;font-size:14px;min-width:200px;background:transparent}
#doctitle:hover,#doctitle:focus{border-color:var(--line);background:var(--panel)}
#savestate{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}

/* ── Layout ─────────────────────────── */
#app{display:flex;flex:1;min-height:0}
#tree{width:280px;min-width:280px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0 20px;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;padding:24px 34px 80px}
#attrs{width:312px;min-width:312px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px;display:none}
#attrs.open{display:block}

/* ── Footer ─────────────────────────── */
#foot{height:24px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);letter-spacing:.03em}

/* ── Tree ─────────────────────────── */
.tree-head{padding:4px 14px 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.tree-head button{margin-left:auto}
.node{display:flex;gap:8px;align-items:baseline;padding:6px 14px;cursor:pointer;border-left:3px solid transparent;font-size:13px;line-height:1.35}
.node:hover{background:var(--paper)}
.node.sel{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent-ink);font-weight:600}
.node .num{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:40px}
.node.sel .num{color:var(--accent)}
.node.l2{padding-left:28px}.node.l3{padding-left:42px}
.node .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--line-soft);border-radius:8px;padding:1px 6px}
#tree-actions{padding:10px 14px 0;display:flex;gap:6px}

/* ── Document pane ─────────────────── */
.crumb{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px}
#sec-head{display:flex;align-items:center;gap:10px;max-width:1000px;margin-bottom:4px}
#sec-num{font-family:var(--mono);font-size:19px;color:var(--accent);font-weight:600;white-space:nowrap}
#sec-title-in{flex:1;font-size:20px;font-weight:700;letter-spacing:-.01em;border:1px solid transparent;border-radius:6px;padding:4px 8px;background:transparent}
#sec-title-in:hover,#sec-title-in:focus{border-color:var(--line);background:var(--panel)}
#sec-ops{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 10px}
.opbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px;font-size:11.5px;color:var(--muted)}
.opbtn:hover{color:var(--accent);border-color:var(--accent)}
.opbtn.danger:hover{color:var(--danger);border-color:var(--danger)}
#sec-hint{font-size:12.5px;color:var(--muted);max-width:760px;line-height:1.5;margin-bottom:14px;padding:10px 12px;background:var(--accent-soft);border-radius:6px;border-left:3px solid var(--accent)}
label.fld{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
textarea.body{width:100%;max-width:860px;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:12px;line-height:1.55;resize:vertical;background:var(--panel)}

/* images */
#imgzone{max-width:860px}
.imgcard{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;background:var(--panel)}
.imgcard img{max-width:220px;max-height:130px;border-radius:4px;border:1px solid var(--line-soft)}
.imgcard .meta{flex:1}
.imgcard input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-top:4px}
.imgcard .nm{font-family:var(--mono);font-size:11px;color:var(--muted)}
.imgcard .rm{border:none;background:none;color:var(--danger);font-size:11.5px;padding:2px 4px}
.imgcard .rm:hover{text-decoration:underline}

/* requirements table */
#reqwrap{max-width:1000px;margin-top:22px}
#reqbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#reqbar h3{font-size:13px;font-weight:700;letter-spacing:.03em}
table.req{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.req th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--paper)}
table.req td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:13px;line-height:1.45}
table.req tr:last-child td{border-bottom:none}
table.req tr.rsel td{background:var(--accent-soft)}
table.req tr:hover td{background:var(--paper)}
td.rid{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap;cursor:pointer}
.chip{display:inline-block;font-size:10.5px;font-weight:600;border-radius:9px;padding:2px 8px;white-space:nowrap}
.chip.T{background:#E8F3EC;color:var(--ok)}.chip.I{background:#F3EDFB;color:var(--draft)}
.chip.A{background:#FDF3E3;color:var(--warn)}.chip.D{background:var(--accent-soft);color:var(--accent-ink)}
.chip.st-Draft{background:var(--line-soft);color:var(--muted)}
.chip.st-Reviewed{background:#FDF3E3;color:var(--warn)}
.chip.st-Approved{background:#E8F3EC;color:var(--ok)}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);font-size:13px;max-width:1000px}

/* ── Attributes panel ─────────────── */
#attrs h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
#attrs .rid-big{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--accent);margin-bottom:10px}
#attrs label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:12px 0 4px}
#attrs input,#attrs select,#attrs textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--panel)}
#attrs textarea{min-height:88px;resize:vertical;line-height:1.5}
.ears{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ears button{font-size:10.5px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:3px 8px;color:var(--muted)}
.ears button:hover{color:var(--accent);border-color:var(--accent)}
#attrs .row2{display:flex;gap:8px}#attrs .row2>div{flex:1}
.del{margin-top:16px;width:100%;border:1px solid #EAD3D0;background:#FBF1F0;color:var(--danger);border-radius:6px;padding:7px}
.del:hover{border-color:var(--danger)}

/* ── Modal ─────────────────────────── */
#veil{position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;align-items:center;justify-content:center;z-index:50}
#veil.open{display:flex}
#modal{background:var(--panel);border-radius:10px;padding:22px;width:440px;max-width:92vw;max-height:88vh;overflow-y:auto}
#modal h3{font-size:15px;margin-bottom:6px}
#modal p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:14px}
#modal .opt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:8px;cursor:pointer;width:100%;background:var(--panel);text-align:left}
#modal .opt:hover{border-color:var(--accent)}
#modal .opt b{font-size:13.5px;display:block}
#modal .opt span{font-size:11.5px;color:var(--muted)}
#modal .ext{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:6px 8px;min-width:52px;text-align:center}
#modal label{font-size:11px;font-weight:600;color:var(--muted)}
#modal input.f{width:100%;margin:4px 0 10px;border:1px solid var(--line);border-radius:6px;padding:7px}
@media (max-width:900px){#attrs{position:fixed;right:0;top:0;bottom:0;box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:20}#tree{width:220px;min-width:220px}}
@media (prefers-reduced-motion:no-preference){.node,.btn,.opbtn{transition:background .12s,color .12s,border-color .12s}}
</style>
</head>

<script>
/* ───────────────────────── default outline & hints ───────────────────────── */
const HINTS={
 "purpose":"Delineate the purpose of this SRS and its intended audience.",
 "scope":"Identify the software product by name; state what it will and will not do; describe benefits, objectives and goals.",
 "overview":"Overview of the product and its context. Fill the subsections.",
 "perspective":"Put the product in perspective with related systems: is it independent or part of a larger system? Interfaces, memory, operations, site adaptation.",
 "functions_ov":"Summarize the major functions the software will perform (a list or diagram is fine).",
 "users":"Describe the intended users: education level, experience, expertise, disabilities.",
 "limits":"General limitations: regulatory policies, hardware limits, interfaces to other applications, parallel operation, audit/control functions, safety and security.",
 "defs":"Define all terms, acronyms and abbreviations needed to interpret the SRS.",
 "intro":"State the identity of the document. Subsections below cover purpose, scope, overview and definitions.",
 "refs":"List every document referenced in the SRS: title, report number, date, publisher, source.",
 "reqs":"All software requirements, stated so that their achievement can be objectively verified. Distribute the requirement items across the subsections below.",
 "func":"Functional requirements: fundamental actions on inputs to produce outputs — validity checks, sequences, responses to abnormal situations, effects of parameters.",
 "perf":"Static and dynamic numerical performance requirements (users supported, transactions/sec, response times). State measurable values.",
 "usab":"Usability / quality-in-use requirements: measurable effectiveness, efficiency, satisfaction in specific contexts of use.",
 "iface":"External interface requirements: user, hardware, software and communication interfaces — name, purpose, format, data items, timing.",
 "db":"Logical requirements for information placed into a database: types of information, frequency of use, entities and relationships, integrity constraints, retention.",
 "constr":"Design constraints imposed by standards, regulations, hardware limitations or organizational policy.",
 "attrsq":"Software system attributes: reliability, availability, security, maintainability, portability — stated as verifiable requirements.",
 "supp":"Additional supporting information needed to understand the requirements.",
 "verif":"For each requirement, define the verification approach (inspection, analysis, demonstration, test) and any acceptance criteria.",
 "assump":"List each assumption or dependency whose change would affect the requirements.",
 "acro":"Alphabetical list of acronyms and abbreviations used in this document."
};
function defaultSecs(){
  const S=(t,l,h,a)=>({t,l,hint:h||"",app:!!a,body:"",reqs:[],imgs:[]});
  return [
   S("Introduction",1,"intro"),S("Purpose",2,"purpose"),S("Scope",2,"scope"),S("Product overview",2,"overview"),
   S("Product perspective",3,"perspective"),S("Product functions",3,"functions_ov"),S("User characteristics",3,"users"),S("Limitations",3,"limits"),
   S("Definitions",2,"defs"),
   S("References",1,"refs"),
   S("Specific requirements",1,"reqs"),S("Functions",2,"func"),S("Performance requirements",2,"perf"),S("Usability requirements",2,"usab"),
   S("Interface requirements",2,"iface"),S("Logical database requirements",2,"db"),S("Design constraints",2,"constr"),
   S("Software system attributes",2,"attrsq"),S("Supporting information",2,"supp"),
   S("Verification",1,"verif"),
   S("Assumptions and dependencies",1,"assump",true),
   S("Acronyms and abbreviations",1,"acro",true)
  ];
}
const VER_LETTER={Test:"T",Inspection:"I",Analysis:"A",Demonstration:"D"};

let doc=null, curSec=0, curReq=null, saveTimer=null;

function blank(){
  return {v:2,meta:{project:"",org:"Institute of Engineering and Management, Kolkata",authors:"",version:"1.0",date:new Date().toISOString().slice(0,10),docid:"SRS-001"},
    secs:defaultSecs(), seq:0};
}
/* migrate v1 (sections keyed by clause number) */
function migrate(old){
  const d=blank(); d.meta=Object.assign(d.meta,old.meta||{}); d.seq=old.seq||0;
  if(old.sections){
    const map={"1":0,"1.1":1,"1.2":2,"1.3":3,"1.3.1":4,"1.3.2":5,"1.3.3":6,"1.3.4":7,"1.4":8,"2":9,"3":10,"3.1":11,"3.2":12,"3.3":13,"3.4":14,"3.5":15,"3.6":16,"3.7":17,"3.8":18,"4":19,"A":20,"B":21};
    Object.entries(old.sections).forEach(([k,s])=>{ const i=map[k]; if(i!=null){d.secs[i].body=s.body||""; d.secs[i].reqs=s.reqs||[];}});
  }
  return d;
}
function load(){
  try{
    const s2=localStorage.getItem("srs-studio-v2");
    if(s2){doc=JSON.parse(s2);}
    else{ const s1=localStorage.getItem("srs-studio"); doc=s1?migrate(JSON.parse(s1)):blank(); }
  }catch(e){doc=blank();}
  sanitize();
}
function sanitize(){
  if(!doc.secs||!doc.secs.length){ if(doc.sections){doc=migrate(doc);} else doc.secs=defaultSecs(); }
  doc.secs.forEach(s=>{s.reqs=s.reqs||[];s.imgs=s.imgs||[];s.l=Math.min(3,Math.max(1,s.l||1));});
  if(curSec>=doc.secs.length)curSec=0;
}
function persist(){
  try{ localStorage.setItem("srs-studio-v2",JSON.stringify(doc));
    document.getElementById("savestate").textContent="saved locally · "+new Date().toLocaleTimeString();
  }catch(e){ document.getElementById("savestate").textContent="⚠ browser storage full — use Save JSON"; }
  recordHistory();
}
function touch(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist,400); }

/* ── undo / redo history ── */
let histPast=[], histFuture=[], histFreeze=false;
function histLimit(json){ return json.length>2_000_000 ? 12 : 50; } // fewer snapshots for image-heavy docs
function recordHistory(){
  if(histFreeze) return;
  const snap=JSON.stringify(doc);
  if(histPast.length && histPast[histPast.length-1]===snap) return;
  histPast.push(snap); histFuture=[];
  const lim=histLimit(snap);
  while(histPast.length>lim) histPast.shift();
  updateHistBtns();
}
function applyState(json){
  histFreeze=true;
  doc=JSON.parse(json); sanitize();
  if(curSec>=doc.secs.length) curSec=doc.secs.length-1;
  curReq=null;
  document.getElementById("doctitle").value=doc.meta.project||"";
  renderAll();
  try{ localStorage.setItem("srs-studio-v2",json); }catch(e){}
  document.getElementById("savestate").textContent="saved locally · "+new Date().toLocaleTimeString();
  histFreeze=false;
  updateHistBtns();
}
function undo(){
  clearTimeout(saveTimer);
  if(histPast.length<2) return;               // [0] is current state
  histFuture.push(histPast.pop());
  applyState(histPast[histPast.length-1]);
}
function redo(){
  clearTimeout(saveTimer);
  if(!histFuture.length) return;
  const s=histFuture.pop(); histPast.push(s);
  applyState(s);
}
function updateHistBtns(){
  document.getElementById("b-undo").disabled = histPast.length<2;
  document.getElementById("b-redo").disabled = !histFuture.length;
  document.getElementById("b-undo").style.opacity = histPast.length<2 ? .45 : 1;
  document.getElementById("b-redo").style.opacity = !histFuture.length ? .45 : 1;
}
document.getElementById("b-undo").onclick=undo;
document.getElementById("b-redo").onclick=redo;
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  const inField = tag==="input"||tag==="textarea"||tag==="select";
  if(inField) return;   // let the browser's native text-undo work inside fields
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
  else if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==="y" || (e.shiftKey && e.key.toLowerCase()==="z"))){ e.preventDefault(); redo(); }
});

/* ── new blank project ── */
document.getElementById("b-new").onclick=()=>{
  if(!confirm("Start a new blank SRS?\n\nYour current project will be replaced. If you haven't downloaded it, click Cancel and use “Save JSON” first."))return;
  doc=blank(); curSec=0; curReq=null;
  document.getElementById("doctitle").value="";
  renderAll(); persist();
};

/* ───────────────────────── numbering ───────────────────────── */
function numbering(){
  const nums=[]; const c=[0,0,0]; let appIdx=0;
  doc.secs.forEach(s=>{
    if(s.app && s.l===1){ appIdx++; c[0]=0;c[1]=0;c[2]=0; nums.push(String.fromCharCode(64+appIdx)); return; }
    if(s.l===1){c[0]++;c[1]=0;c[2]=0;nums.push(""+c[0]);}
    else if(s.l===2){c[1]++;c[2]=0;nums.push(c[0]+"."+c[1]);}
    else {c[2]++;nums.push(c[0]+"."+c[1]+"."+c[2]);}
  });
  return nums;
}

/* ───────────────────────── tree ───────────────────────── */
function renderTree(){
  const box=document.getElementById("treelist"); box.innerHTML="";
  const nums=numbering();
  doc.secs.forEach((s,i)=>{
    const d=document.createElement("div");
    d.className="node l"+s.l+(i===curSec?" sel":"");
    d.setAttribute("role","button"); d.tabIndex=0;
    const n=s.reqs.length;
    d.innerHTML=`<span class="num">${nums[i]}</span><span>${esc(s.t)||"<i>untitled</i>"}</span>`+(n?`<span class="cnt">${n}</span>`:"");
    d.onclick=()=>selectSection(i);
    d.onkeydown=e=>{if(e.key==="Enter")selectSection(i)};
    box.appendChild(d);
  });
}
function selectSection(i){ curSec=i; curReq=null; renderAll(); }
function renderAll(){ renderTree(); renderMain(); renderAttrs(); }

/* ───────────────────────── section ops ───────────────────────── */
document.getElementById("b-addsec").onclick=()=>{
  const s={t:"New section",l:doc.secs[curSec]?doc.secs[curSec].l:1,hint:"",app:false,body:"",reqs:[],imgs:[]};
  doc.secs.splice(curSec+1,0,s); curSec=curSec+1; touch(); renderAll();
  document.getElementById("sec-title-in").focus(); document.getElementById("sec-title-in").select();
};
document.getElementById("b-addsub").onclick=()=>{
  const pl=doc.secs[curSec]?doc.secs[curSec].l:1;
  const s={t:"New subsection",l:Math.min(3,pl+1),hint:"",app:false,body:"",reqs:[],imgs:[]};
  doc.secs.splice(curSec+1,0,s); curSec=curSec+1; touch(); renderAll();
  document.getElementById("sec-title-in").focus(); document.getElementById("sec-title-in").select();
};
document.getElementById("op-del").onclick=()=>{
  if(doc.secs.length<=1){alert("The document needs at least one section.");return;}
  const s=doc.secs[curSec];
  const msg=s.reqs.length?`Remove “${s.t}” and its ${s.reqs.length} requirement(s)?`:`Remove section “${s.t}”?`;
  if(!confirm(msg))return;
  doc.secs.splice(curSec,1); curSec=Math.max(0,curSec-1); curReq=null; touch(); renderAll();
};
document.getElementById("op-up").onclick=()=>{ if(curSec===0)return;
  [doc.secs[curSec-1],doc.secs[curSec]]=[doc.secs[curSec],doc.secs[curSec-1]]; curSec--; touch(); renderAll(); };
document.getElementById("op-dn").onclick=()=>{ if(curSec>=doc.secs.length-1)return;
  [doc.secs[curSec+1],doc.secs[curSec]]=[doc.secs[curSec],doc.secs[curSec+1]]; curSec++; touch(); renderAll(); };
document.getElementById("op-in").onclick=()=>{ const s=doc.secs[curSec]; if(s.l<3){s.l++; touch(); renderAll();} };
document.getElementById("op-out").onclick=()=>{ const s=doc.secs[curSec]; if(s.l>1){s.l--; touch(); renderAll();} };
document.getElementById("op-app").onclick=()=>{ const s=doc.secs[curSec]; s.app=!s.app; if(s.app)s.l=1; touch(); renderAll(); };

/* ───────────────────────── main pane ───────────────────────── */
function renderMain(){
  const s=doc.secs[curSec]; const nums=numbering();
  document.getElementById("crumb").textContent="Software Requirements Specification › "+(s.app?"appendix":"clause")+" "+nums[curSec];
  document.getElementById("sec-num").textContent=nums[curSec];
  const ti=document.getElementById("sec-title-in");
  ti.value=s.t; ti.oninput=()=>{s.t=ti.value; touch(); renderTree();};
  const hint=HINTS[s.hint]||"";
  const hd=document.getElementById("sec-hint");
  hd.style.display=hint?"block":"none"; hd.textContent=hint;
  document.getElementById("op-app").style.background=s.app?"var(--accent-soft)":"";
  const ta=document.getElementById("secbody");
  ta.value=s.body; ta.oninput=()=>{s.body=ta.value; touch();};
  renderImgs(); renderReqs();
}

/* images */
document.getElementById("b-addimg").onclick=()=>document.getElementById("imgin").click();
document.getElementById("imgin").onchange=e=>{
  const files=[...e.target.files]; e.target.value="";
  files.forEach(f=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.naturalWidth,h=img.naturalHeight,d=rd.result;
        if(w>1400){ const cv=document.createElement("canvas"); const k=1400/w;
          cv.width=1400; cv.height=Math.round(h*k);
          cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
          d=cv.toDataURL("image/jpeg",0.88); w=cv.width; h=cv.height; }
        doc.secs[curSec].imgs.push({name:f.name,cap:"",d,w,h});
        touch(); renderImgs();
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  });
};
function renderImgs(){
  const z=document.getElementById("imgzone"); const imgs=doc.secs[curSec].imgs;
  z.innerHTML="";
  imgs.forEach((im,i)=>{
    const c=document.createElement("div"); c.className="imgcard";
    c.innerHTML=`<img src="${im.d}" alt=""><div class="meta">
      <div class="nm">${esc(im.name)} · ${im.w}×${im.h}</div>
      <input placeholder="Figure caption…" value="${esc(im.cap)}">
      <button class="rm">Remove image</button></div>`;
    c.querySelector("input").oninput=e=>{im.cap=e.target.value; touch();};
    c.querySelector(".rm").onclick=()=>{ if(confirm("Remove this image?")){imgs.splice(i,1); touch(); renderImgs();} };
    z.appendChild(c);

}

/* requirements */
function renderReqs(){
  const zone=document.getElementById("reqzone"); const reqs=doc.secs[curSec].reqs;
  if(!reqs.length){ zone.innerHTML=`<div class="empty">No requirements in this section. Click <b>+ Add requirement</b> to create one.</div>`; return;}
  let html=`<table class="req"><thead><tr><th style="width:92px">ID</th><th>Requirement statement</th><th style="width:86px">Priority</th><th style="width:70px">Verif.</th><th style="width:92px">Status</th></tr></thead><tbody>`;
  reqs.forEach(r=>{
    const vl=VER_LETTER[r.ver]||"T";
    html+=`<tr data-id="${r.id}" class="${curReq===r.id?"rsel":""}">
      <td class="rid">${r.id}</td>
      <td>${r.name?`<b>${esc(r.name)}</b><br>`:""}${esc(r.text)||"<i style='color:var(--muted)'>— empty statement —</i>"}</td>
      <td>${esc(r.pri)}</td>
      <td><span class="chip ${vl}">${vl} · ${esc(r.ver)}</span></td>
      <td><span class="chip st-${r.status}">${esc(r.status)}</span></td></tr>`;
  });
  zone.innerHTML=html+"</tbody></table>";
  zone.querySelectorAll("tr[data-id]").forEach(tr=>tr.onclick=()=>{curReq=tr.dataset.id; renderReqs(); renderAttrs();});

function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

document.getElementById("b-addreq").onclick=()=>{
  doc.seq++; const id="SRS-"+String(doc.seq).padStart(3,"0");
  doc.secs[curSec].reqs.push({id,name:"",text:"",type:guessType(),pri:"Should",ver:"Test",status:"Draft",rationale:"",source:""});
  curReq=id; touch(); renderTree(); renderReqs(); renderAttrs();
};
function guessType(){
  const t=(doc.secs[curSec].t||"").toLowerCase();
  if(t.includes("perform"))return "Performance"; if(t.includes("usab"))return "Usability";
  if(t.includes("interface"))return "Interface"; if(t.includes("database"))return "Database";
  if(t.includes("constraint"))return "Design constraint"; if(t.includes("attribute"))return "Quality attribute";
  if(t.includes("verif"))return "Verification"; return "Functional";
}

/* ── DOCX export ── */
let docxLib=null;
function loadDocx(){
  if(window.docx){docxLib=window.docx;return Promise.resolve();}
  const urls=[
    "https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js",
    "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js",
    "https://unpkg.com/docx@8.5.0/build/index.umd.js"
  ];
  return new Promise((res,rej)=>{
    let i=0;
    const next=()=>{ if(i>=urls.length)return rej();
      const s=document.createElement("script"); s.src=urls[i++];
      s.onload=()=>{ if(window.docx){docxLib=window.docx;res();} else next(); };
      s.onerror=next; document.head.appendChild(s); };
    next();
  });
}
function b64bytes(dataUrl){
  const b=atob(dataUrl.split(",")[1]); const u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u;
}
async function exportDocx(){
  try{ await loadDocx(); }catch(e){
    alert("Couldn't load the Word library (offline?). Exporting a Word-compatible .doc instead.");
    return download(new Blob(["\ufeff"+docHtml()],{type:"application/msword"}),(doc.meta.project||"srs")+".doc");
  }
  const D=docxLib, m=doc.meta, kids=[]; const nums=numbering(); let figN=0;
  const P=(t,o={})=>new D.Paragraph({children:[new D.TextRun(Object.assign({text:t,size:22,font:"Calibri"},o.run||{}))],...o.par});
  const imgPar=(im,maxW)=>{
    let w=im.w,h=im.h; if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
    return new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{before:120,after:60},
      children:[new D.ImageRun({data:b64bytes(im.d),transformation:{width:w,height:h}})]});
  };
  /* cover: institute logo, centred */
  kids.push(imgPar({d:LOGO,w:1100,h:170},600));
  kids.push(P("SOFTWARE REQUIREMENTS SPECIFICATION",{run:{size:20,color:"555555",characterSpacing:60},par:{alignment:D.AlignmentType.CENTER,spacing:{before:900,after:300}}}));
  kids.push(P(m.project||"Untitled system",{run:{size:52,bold:true},par:{alignment:D.AlignmentType.CENTER,spacing:{after:200}}}));
  kids.push(P("Prepared in accordance with ISO/IEC/IEEE 29148:2018",{run:{size:24,italics:true},par:{alignment:D.AlignmentType.CENTER,spacing:{after:600}}}));
  [["Document ID",m.docid],["Version",m.version],["Date",m.date],["Author(s)",m.authors],["Organization",m.org]].forEach(([k,vv])=>{
    kids.push(P(k+":  "+(vv||"—"),{par:{alignment:D.AlignmentType.CENTER,spacing:{after:60}}}));});
  kids.push(new D.Paragraph({children:[],pageBreakBefore:true}));
  /* sections */
  const HL={1:D.HeadingLevel.HEADING_1,2:D.HeadingLevel.HEADING_2,3:D.HeadingLevel.HEADING_3};
  const cell=(t,opts={})=>new D.TableCell({children:[new D.Paragraph({children:[new D.TextRun(Object.assign({text:t,size:20,font:"Calibri"},opts.run||{}))]})],
     shading:opts.shade?{fill:"EFEFEF"}:undefined, width:opts.w?{size:opts.w,type:D.WidthType.PERCENTAGE}:undefined, margins:{top:80,bottom:80,left:100,right:100}});
  doc.secs.forEach((s,i)=>{
    kids.push(new D.Paragraph({heading:HL[s.l],spacing:{before:280,after:120},children:[new D.TextRun({text:nums[i]+"   "+s.t})]}));
    if(s.body) s.body.split(/\n+/).forEach(par=>kids.push(P(par,{par:{spacing:{after:120}}})));
    s.imgs.forEach(im=>{ figN++;
      kids.push(imgPar(im,560));
      kids.push(P("Figure "+figN+(im.cap?": "+im.cap:""),{run:{italics:true,size:18,color:"444444"},par:{alignment:D.AlignmentType.CENTER,spacing:{after:160}}}));
    });
    if(s.reqs.length){
      const rows=[new D.TableRow({tableHeader:true,children:[
        cell("ID",{shade:1,run:{bold:true},w:14}),cell("Requirement",{shade:1,run:{bold:true},w:47}),
        cell("Priority",{shade:1,run:{bold:true},w:11}),cell("Verification",{shade:1,run:{bold:true},w:15}),cell("Status",{shade:1,run:{bold:true},w:13})]})];
      s.reqs.forEach(r=>{
        const runs=[]; if(r.name) runs.push(new D.TextRun({text:r.name+". ",bold:true,size:20,font:"Calibri"}));
        runs.push(new D.TextRun({text:r.text||"",size:20,font:"Calibri"}));
        if(r.rationale) runs.push(new D.TextRun({text:"Rationale: "+r.rationale,italics:true,size:18,color:"555555",font:"Calibri",break:1}));
        rows.push(new D.TableRow({children:[
          cell(r.id,{run:{font:"Consolas",bold:true}}),
          new D.TableCell({children:[new D.Paragraph({children:runs})],margins:{top:80,bottom:80,left:100,right:100}}),
          cell(r.pri),cell(r.ver),cell(r.status)]}));
      });
      kids.push(new D.Table({rows,width:{size:100,type:D.WidthType.PERCENTAGE}}));
      kids.push(P("",{par:{spacing:{after:120}}}));
    }
  });
  kids.push(P("Generated with SRS Studio · developed by Rajdeep Das, Dept. of CSE-AIML, IEM-UEM Kolkata",
    {run:{size:14,color:"999999"},par:{alignment:D.AlignmentType.CENTER,spacing:{before:600}}}));
  const file=new D.Document({styles:{default:{heading1:{run:{size:30,bold:true,color:"17222D"},paragraph:{spacing:{before:300,after:140}}},
    heading2:{run:{size:26,bold:true,color:"17222D"}},heading3:{run:{size:23,bold:true,color:"17222D"}}}},
    sections:[{properties:{},children:kids}]});
  const blob=await D.Packer.toBlob(file);
  download(blob,(m.project||"srs")+".docx");
}

/* ───────────────────────── boot ───────────────────────── */
load();
document.getElementById("doctitle").value=doc.meta.project||"";
renderAll(); persist();
</script>
